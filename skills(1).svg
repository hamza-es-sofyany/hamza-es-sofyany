<svg width="1100" height="350" viewBox="0 0 1100 350" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="220%">
    <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#64748B" flood-opacity=".22"/>
  </filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF"/>
    <stop offset=".55" stop-color="#F8FAFC"/>
    <stop offset="1" stop-color="#E2E8F0"/>
  </linearGradient>
  <style>
    .tile { animation: float 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin:center; }
    .d1{animation-delay:0s}.d2{animation-delay:.18s}.d3{animation-delay:.36s}.d4{animation-delay:.54s}
    .d5{animation-delay:.72s}.d6{animation-delay:.90s}.d7{animation-delay:1.08s}.d8{animation-delay:1.26s}
    .d9{animation-delay:1.44s}.d10{animation-delay:1.62s}.d11{animation-delay:1.80s}.d12{animation-delay:1.98s}
    @keyframes float {0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    .name{font-family:Inter,Arial,sans-serif;font-size:12px;font-weight:700;fill:#334155}
    .title{font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:800;letter-spacing:3px;fill:#334155}
  </style>
</defs>


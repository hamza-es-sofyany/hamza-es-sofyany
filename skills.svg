<svg width="600" height="200" viewBox="0 0 600 200" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @keyframes rippleWave {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.05); }
      }
      .icon {
        animation: rippleWave 2.5s infinite ease-in-out;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Row 1 -->
  <image xlink:href="https://simpleicons.org/icons/c.svg" x="40" y="20" width="60" height="60" class="icon" style="animation-delay: 0s;" />
  <image xlink:href="https://simpleicons.org/icons/python.svg" x="130" y="20" width="60" height="60" class="icon" style="animation-delay: 0.2s;" />
  <image xlink:href="https://simpleicons.org/icons/javascript.svg" x="220" y="20" width="60" height="60" class="icon" style="animation-delay: 0.4s;" />
  <image xlink:href="https://simpleicons.org/icons/typescript.svg" x="310" y="20" width="60" height="60" class="icon" style="animation-delay: 0.6s;" />
  <image xlink:href="https://simpleicons.org/icons/linux.svg" x="400" y="20" width="60" height="60" class="icon" style="animation-delay: 0.8s;" />
  <image xlink:href="https://simpleicons.org/icons/bash.svg" x="490" y="20" width="60" height="60" class="icon" style="animation-delay: 1.0s;" />

  <!-- Row 2 -->
  <image xlink:href="https://simpleicons.org/icons/git.svg" x="40" y="110" width="60" height="60" class="icon" style="animation-delay: 1.2s;" />
  <image xlink:href="https://simpleicons.org/icons/visualstudiocode.svg" x="130" y="110" width="60" height="60" class="icon" style="animation-delay: 1.4s;" />
  <image xlink:href="https://simpleicons.org/icons/github.svg" x="220" y="110" width="60" height="60" class="icon" style="animation-delay: 1.6s;" />
  <image xlink:href="https://simpleicons.org/icons/html5.svg" x="310" y="110" width="60" height="60" class="icon" style="animation-delay: 1.8s;" />
  <image xlink:href="https://simpleicons.org/icons/css3.svg" x="400" y="110" width="60" height="60" class="icon" style="animation-delay: 2.0s;" />
  <image xlink:href="https://simpleicons.org/icons/tailwindcss.svg" x="490" y="110" width="60" height="60" class="icon" style="animation-delay: 2.2s;" />
</svg>

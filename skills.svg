<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.5" stop-color="#0D1726"/>
      <stop offset="1" stop-color="#050A12"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#18283D"/>
      <stop offset="1" stop-color="#0B1421"/>
    </linearGradient>

    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#21344C"/>
      <stop offset="1" stop-color="#101A28"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#86EFAC"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>

    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>

    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FEF08A"/>
      <stop offset="1" stop-color="#EAB308"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.45"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .card { animation: float 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d1 { animation-delay: 0s; }
      .d2 { animation-delay: .2s; }
      .d3 { animation-delay: .4s; }
      .d4 { animation-delay: .6s; }
      .d5 { animation-delay: .8s; }
      .d6 { animation-delay: 1s; }
      .d7 { animation-delay: 1.2s; }
      .d8 { animation-delay: 1.4s; }
      .d9 { animation-delay: 1.6s; }
      .d10 { animation-delay: 1.8s; }
      .d11 { animation-delay: 2s; }
      .d12 { animation-delay: 2.2s; }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }

      .label {
        font-family: Inter, Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .5px;
        fill: #E5EDF7;
      }

      .icon {
        font-family: Inter, Arial, sans-serif;
        font-weight: 900;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .small {
        font-family: Inter, Arial, sans-serif;
        font-size: 9px;
        font-weight: 700;
        fill: #8EA3BA;
        letter-spacing: 1.8px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="8" y="8" width="884" height="284" rx="28" fill="url(#bg)" stroke="#1E334A"/>

  <!-- subtle background light -->
  <ellipse cx="450" cy="55" rx="280" ry="45" fill="#38BDF8" opacity=".06" filter="url(#glow)"/>
  <ellipse cx="450" cy="270" rx="260" ry="35" fill="#2563EB" opacity=".05" filter="url(#glow)"/>

  <!-- Header -->
  <text x="450" y="34" text-anchor="middle" class="small">LANGUAGES &amp; TOOLS</text>
  <path d="M125 45H775" stroke="#263B52" stroke-width="1"/>
  <circle cx="450" cy="45" r="2" fill="#38BDF8"/>

  <!-- ===== ROW 1 ===== -->

  <!-- C -->
  <g class="card d1" filter="url(#shadow)">
    <path d="M43 86 L51 78 H111 L119 86 V146 L111 154 H51 L43 146Z" fill="#06101B"/>
    <rect x="35" y="78" width="76" height="60" rx="14" fill="url(#card)" stroke="#2C4560"/>
    <rect x="47" y="89" width="38" height="38" rx="11" fill="url(#blue)"/>
    <text x="66" y="108" class="icon" font-size="23" fill="white">C</text>
    <text x="94" y="108" class="icon" font-size="10" fill="#A9C5E8">C</text>
  </g>

  <!-- Python -->
  <g class="card d2" filter="url(#shadow)">
    <path d="M119 86 L127 78 H187 L195 86 V146 L187 154 H127 L119 146Z" fill="#06101B"/>
    <rect x="111" y="78" width="76" height="60" rx="14" fill="url(#card)" stroke="#2C4560"/>
    <rect x="123" y="89" width="38" height="38" rx="11" fill="url(#blue)"/>
    <text x="142" y="105" class="icon" font-size="14" fill="white">Py</text>
    <circle cx="135" cy="116" r="2" fill="#FFD43B"/>
    <text x="170" y="108" class="icon" font-size="9" fill="#A9C5E8">PY</text>
  </g>

  <!-- JavaScript -->
  <g class="card d3" filter="url(#shadow)">
    <path d="M195 86 L203 78 H263 L271 86 V146 L263 154 H203 L195 146Z" fill="#06101B"/>
    <rect x="187" y="78" width="76" height="60" rx="14" fill="url(#card)" stroke="#2C4560"/>
    <rect x="199" y="89" width="38" height="38" rx="11" fill="url(#yellow)"/>
    <text x="218" y="108" class="icon" font-size="19" fill="#111827">JS</text>
    <text x="246" y="108" class="icon" font-size="9" fill="#A9C5E8">JS</text>
  </g>

  <!-- TypeScript -->
  <g class="card d4" filter="url(#shadow)">
    <path d="M271 86 L279 78 H339 L347 86 V146 L339 154 H279 L271 146Z" fill="#06101B"/>
    <rect x="263" y="78" width="76" height="60" rx="14" fill="url(#card)" stroke="#2C4560"/>
    <rect x="275" y="89" width="38" height="38" rx="11" fill="url(#blue)"/>
    <text x="294" y="108" class="icon" font-size="16" fill="white">TS</text>
    <text x="322" y="108" class="icon" font-size="9" fill="#A9C5E8">TS</text>
  </g>

  <!-- Linux -->
  <g class="card d5" filter="url(#shadow)">
    <path d="M347 86 L355 78 H415 L423 86 V146 L415 154 H355 L347 146Z" fill="#06101B"/>
    <rect x="339" y="78" width="76" height="60" rx="14" fill="url(#card)" stroke="#2C4560"/>
    <rect x="351" y="89" width="38" height="38" rx="11" fill="url(#yellow)"/>
    <text x="370" y="108" class="icon" font-size="17" fill="#111827">LIN</text>
    <text x="398" y="108" class="icon" font-size="8" fill="#A9C5E8">UX</text>
  </g>

  <!-- Bash -->
  <g class="card d6" filter="url(#shadow)">
    <path d="M423 86 L431 78 H491 L499 86 V146 L491 154 H431 L423 146Z" fill="#06101B"/>
    <rect x="415" y="78" width="76" height="60" rx="14" fill="url(#card)" stroke="#2C4560"/>
    <rect x="427" y="89" width="38" height="38" rx="11" fill="url(#green)"/>
    <text x="446" y="108" class="icon" font-size="18" fill="#07110B">&gt;_</text>
    <text x="474" y="108" class="icon" font-size="9" fill="#A9C5E8">SH</text>
  </g>

  <!-- Git -->
  <g class="card d7" filter="url(#shadow)">
    <path d="M499 86 L507 78 H567 L575 86 V146 L567 154 H507 L499 146Z" fill="#06101B"/>
    <rect x="491" y="78" width="76" height="60" rx="14" fill="url(#card)" stroke="#2C4560"/>
    <rect x="503" y="89" width="38" height="38" rx="11" fill="url(#orange)"/>
    <text x="522" y="108" class="icon" font-size="15" fill="white">git</text>
    <text x="550" y="108" class="icon" font-size="9" fill="#A9C5E8">GIT</text>
  </g>

  <!-- VS Code -->
  <g class="card d8" filter="url(#shadow)">
    <path d="M575 86 L583 78 H643 L651 86 V146 L643 154 H583 L575 146Z" fill="#06101B"/>
    <rect x="567" y="78" width="76" height="60" rx="14" fill="url(#card)" stroke="#2C4560"/>
    <rect x="579" y="89" width="38" height="38" rx="11" fill="url(#blue)"/>
    <text x="598" y="108" class="icon" font-size="13" fill="white">VS</text>
    <text x="626" y="108" class="icon" font-size="8" fill="#A9C5E8">CODE</text>
  </g>

  <!-- GitHub -->
  <g class="card d9" filter="url(#shadow)">
    <path d="M651 86 L659 78 H719 L727 86 V146 L719 154 H659 L651 146Z" fill="#06101B"/>
    <rect x="643" y="78" width="76" height="60" rx="14" fill="url(#card)" stroke="#2C4560"/>
    <rect x="655" y="89" width="38" height="38" rx="11" fill="#F1F5F9"/>
    <text x="674" y="108" class="icon" font-size="15" fill="#111827">GH</text>
    <text x="702" y="108" class="icon" font-size="8" fill="#A9C5E8">GITHUB</text>
  </g>

  <!-- HTML -->
  <g class="card d10" filter="url(#shadow)">
    <path d="M727 86 L735 78 H795 L803 86 V146 L795 154 H735 L727 146Z" fill="#06101B"/>
    <rect x="719" y="78" width="76" height="60" rx="14" fill="url(#card)" stroke="#2C4560"/>
    <rect x="731" y="89" width="38" height="38" rx="11" fill="url(#orange)"/>
    <text x="750" y="108" class="icon" font-size="14" fill="white">5</text>
    <text x="778" y="108" class="icon" font-size="8" fill="#A9C5E8">HTML</text>
  </g>

  <!-- ===== ROW 2 ===== -->

  <!-- CSS -->
  <g class="card d11" filter="url(#shadow)">
    <path d="M150 175 L158 167 H218 L226 175 V235 L218 243 H158 L150 235Z" fill="#06101B"/>
    <rect x="142" y="167" width="76" height="60" rx="14" fill="url(#card2)" stroke="#2C4560"/>
    <rect x="154" y="178" width="38" height="38" rx="11" fill="url(#blue)"/>
    <text x="173" y="197" class="icon" font-size="14" fill="white">3</text>
    <text x="201" y="197" class="icon" font-size="8" fill="#A9C5E8">CSS</text>
  </g>

  <!-- Tailwind -->
  <g class="card d12" filter="url(#shadow)">
    <path d="M226 175 L234 167 H294 L302 175 V235 L294 243 H234 L226 235Z" fill="#06101B"/>
    <rect x="218" y="167" width="76" height="60" rx="14" fill="url(#card2)" stroke="#2C4560"/>
    <rect x="230" y="178" width="38" height="38" rx="11" fill="url(#cyan)"/>
    <text x="249" y="197" class="icon" font-size="15" fill="#06202B">TW</text>
    <text x="277" y="197" class="icon" font-size="8" fill="#A9C5E8">TAILWIND</text>
  </g>

  <!-- Center signature -->
  <g opacity=".9">
    <text x="450" y="194" text-anchor="middle"
          font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800"
          fill="#EAF2FA">HAMZA</text>
    <text x="450" y="214" text-anchor="middle"
          font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700"
          letter-spacing="3" fill="#5B7896">SOFTWARE ENGINEERING • 1337</text>
    <path d="M390 225H510" stroke="#2A435C"/>
    <circle cx="450" cy="225" r="2.5" fill="#38BDF8"/>
  </g>

  <!-- Small decorative 3D blocks -->
  <g opacity=".55">
    <path d="M70 218l10-6 10 6-10 6z" fill="#38BDF8"/>
    <path d="M80 224v12l10-6v-12z" fill="#075985"/>
    <path d="M80 224l-10-6v12l10 6z" fill="#0E7490"/>

    <path d="M810 218l10-6 10 6-10 6z" fill="#60A5FA"/>
    <path d="M820 224v12l10-6v-12z" fill="#1D4ED8"/>
    <path d="M820 224l-10-6v12l10 6z" fill="#1E40AF"/>
  </g>

  <!-- Footer -->
  <text x="450" y="273" text-anchor="middle" class="small">BUILD • LEARN • SHIP</text>
</svg>

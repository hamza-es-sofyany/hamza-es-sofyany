<svg width="600" height="170" viewBox="0 0 600 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes floatWave {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      .icon-box {
        animation: floatWave 2.8s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- ROW 1 -->
  <!-- C -->
  <g class="icon-box" style="animation-delay: 0s;" transform="translate(40, 15)">
    <rect width="60" height="60" rx="12" fill="#00599C"/>
    <text x="30" y="40" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="white" text-anchor="middle">C</text>
  </g>

  <!-- Python -->
  <g class="icon-box" style="animation-delay: 0.2s;" transform="translate(130, 15)">
    <rect width="60" height="60" rx="12" fill="#3776AB"/>
    <text x="30" y="40" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#FFE873" text-anchor="middle">Py</text>
  </g>

  <!-- JS -->
  <g class="icon-box" style="animation-delay: 0.4s;" transform="translate(220, 15)">
    <rect width="60" height="60" rx="12" fill="#F7DF1E"/>
    <text x="30" y="41" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="black" text-anchor="middle">JS</text>
  </g>

  <!-- TS -->
  <g class="icon-box" style="animation-delay: 0.6s;" transform="translate(310, 15)">
    <rect width="60" height="60" rx="12" fill="#007ACC"/>
    <text x="30" y="41" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="white" text-anchor="middle">TS</text>
  </g>

  <!-- Linux -->
  <g class="icon-box" style="animation-delay: 0.8s;" transform="translate(400, 15)">
    <rect width="60" height="60" rx="12" fill="#FCC624"/>
    <text x="30" y="38" font-family="Arial, sans-serif" font-weight="bold" font-size="26" fill="black" text-anchor="middle">🐧</text>
  </g>

  <!-- Bash -->
  <g class="icon-box" style="animation-delay: 1.0s;" transform="translate(490, 15)">
    <rect width="60" height="60" rx="12" fill="#4EAA25"/>
    <text x="30" y="39" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="white" text-anchor="middle">&gt;_</text>
  </g>

  <!-- ROW 2 -->
  <!-- Git -->
  <g class="icon-box" style="animation-delay: 1.2s;" transform="translate(40, 95)">
    <rect width="60" height="60" rx="12" fill="#F05032"/>
    <text x="30" y="40" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="white" text-anchor="middle">Git</text>
  </g>

  <!-- VS Code -->
  <g class="icon-box" style="animation-delay: 1.4s;" transform="translate(130, 95)">
    <rect width="60" height="60" rx="12" fill="#007ACC"/>
    <text x="30" y="40" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="white" text-anchor="middle">VSC</text>
  </g>

  <!-- GitHub -->
  <g class="icon-box" style="animation-delay: 1.6s;" transform="translate(220, 95)">
    <rect width="60" height="60" rx="12" fill="#24292E"/>
    <text x="30" y="41" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="white" text-anchor="middle">GH</text>
  </g>

  <!-- HTML -->
  <g class="icon-box" style="animation-delay: 1.8s;" transform="translate(310, 95)">
    <rect width="60" height="60" rx="12" fill="#E34F26"/>
    <text x="30" y="40" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="white" text-anchor="middle">HTML</text>
  </g>

  <!-- CSS -->
  <g class="icon-box" style="animation-delay: 2.0s;" transform="translate(400, 95)">
    <rect width="60" height="60" rx="12" fill="#1572B6"/>
    <text x="30" y="40" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="white" text-anchor="middle">CSS</text>
  </g>

  <!-- Tailwind -->
  <g class="icon-box" style="animation-delay: 2.2s;" transform="translate(490, 95)">
    <rect width="60" height="60" rx="12" fill="#06B6D4"/>
    <text x="30" y="40" font-family="Arial, sans-serif" font-weight="bold" font-size="17" fill="white" text-anchor="middle">TW</text>
  </g>
</svg>
